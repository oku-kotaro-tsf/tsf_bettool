<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>リアルタイムBET</title>
<style>
:root{
  --bg:#0f1220; --panel:#181c2e; --panel2:#20253b; --line:#2c3250;
  --text:#eef0f8; --sub:#9aa1bf; --yes:#22c58b; --yes-d:#0f3d2f; --no:#ff5c7a; --no-d:#4a1a26;
  --gold:#ffc94d; --accent:#7c8cff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 76px) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:14px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:12px 14px 16px;max-width:560px;margin:0 auto}
.wallet{background:linear-gradient(135deg,#2a2f6b,#3a2459);border:1px solid #4a4f8a;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.wallet .lbl{font-size:12px;color:#c9cdf0}
.wallet .pts{font-size:30px;font-weight:800;letter-spacing:.5px}
.wallet .pts small{font-size:14px;font-weight:600;margin-left:3px;color:#c9cdf0}
.wallet .right{text-align:right;font-size:12px;color:#c9cdf0;line-height:1.6}
.wallet .right b{color:var(--text)}
.status{font-size:12px;color:var(--sub);margin:8px 2px 0;min-height:16px}
.status.warn{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.open{border-color:#3d4687}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.title{font-size:17px;font-weight:700;line-height:1.4;word-break:break-word}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.b-open{background:#1e3a6e;color:#8fb6ff}
.b-closed{background:#4a3a12;color:var(--gold)}
.b-settled{background:#2a2d40;color:#b9bdd6}
.b-void{background:#2a2d40;color:#8a8fa8}
.pool{margin:12px 0 4px}
.bar{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--panel2);font-size:13px;font-weight:700}
.bar div{display:flex;align-items:center;padding:0 10px;white-space:nowrap;transition:flex-grow .5s ease;min-width:0}
.bar .y{background:var(--yes);color:#04281c;justify-content:flex-start}
.bar .n{background:var(--no);color:#3d0613;justify-content:flex-end}
.poolinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.poolinfo b{color:var(--text)}
.odds-y{color:var(--yes)} .odds-n{color:var(--no)}
.mybet{margin-top:10px;font-size:13px;background:var(--panel2);border-radius:10px;padding:8px 10px}
.betbox{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.amt{display:flex;gap:6px;align-items:center}
.amt input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:20px;font-weight:700;border-radius:10px;padding:8px 10px;text-align:right}
.amt span{color:var(--sub);font-size:13px}
.chips{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.chip{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:7px 0;font-size:13px;font-weight:600;min-width:52px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.btn-yes,.btn-no{border:none;border-radius:12px;padding:14px 0;font-size:18px;font-weight:800;letter-spacing:1px}
.btn-yes{background:var(--yes);color:#04281c}
.btn-no{background:var(--no);color:#3d0613}
.btn-yes.sel{box-shadow:0 0 0 3px #fff inset}
.btn-no.sel{box-shadow:0 0 0 3px #fff inset}
.link{background:none;border:none;color:var(--sub);font-size:12px;text-decoration:underline;padding:6px 0}
.who{margin-top:8px;font-size:12px;color:var(--sub)}
.who ul{list-style:none;padding:0;margin:6px 0 0;max-height:220px;overflow:auto}
.who li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.who li .s-y{color:var(--yes);font-weight:700}.who li .s-n{color:var(--no);font-weight:700}
.result{margin-top:10px;font-size:14px;font-weight:700}
.gain{color:var(--yes)} .loss{color:var(--no)}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px;line-height:1.8}
.rank li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rank ul{list-style:none;margin:0;padding:0}
.rank .no{width:28px;text-align:center;font-weight:800;color:var(--sub)}
.rank .no.g1{color:var(--gold)} .rank .no.g2{color:#d6dbe9} .rank .no.g3{color:#e0a46a}
.rank .nm{flex:1;word-break:break-all}
.rank .pt{font-weight:800}
.rank li.me{background:#262c55;border-radius:10px}
.rank .diff{font-size:11px;margin-left:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#12152a;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:none;color:var(--sub);padding:12px 0 14px;font-size:13px;font-weight:700}
nav.tabs button.on{color:var(--text);box-shadow:0 -3px 0 var(--accent) inset}
h2{font-size:15px;margin:4px 2px 10px;color:var(--sub);font-weight:700}
.adm input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:16px;border-radius:10px;padding:10px}
.btn{background:var(--accent);color:#0b0e25;border:none;border-radius:10px;padding:10px 14px;font-weight:800;font-size:14px}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#5a1d2a;color:#ffc2cd;border:1px solid #7a2a3a}
.btn.yes{background:var(--yes);color:#04281c}.btn.no{background:var(--no);color:#3d0613}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btns .btn{flex:1;min-width:80px;padding:9px 6px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:360px;width:100%}
.modal p{margin:0 0 14px;line-height:1.6;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2c3260;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.flash{animation:fl .8s ease}
@keyframes fl{0%{background:#2f3a7a}100%{background:var(--panel)}}
.hint{font-size:12px;color:var(--sub);line-height:1.6;margin-top:8px}
</style>
<style>
.join{max-width:420px;margin:12vh auto 0;padding:0 18px;text-align:center}
.join h1{font-size:26px;margin:0 0 6px}
.join p{color:var(--sub);font-size:14px;line-height:1.7;margin:0 0 20px}
.join input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:18px;border-radius:12px;padding:14px;text-align:center;margin-bottom:12px}
.join .btn{width:100%;padding:14px;font-size:16px}
.setup{max-width:520px;margin:10vh auto;padding:20px;line-height:1.8;color:var(--sub)}
.setup code{background:var(--panel2);padding:2px 6px;border-radius:6px;color:var(--text)}
.modetag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:#4a3a12;color:var(--gold);margin-right:4px}
.modetag.auto{background:#1e2a55;color:#9fb0ff}
.seg{display:flex;gap:6px;margin:10px 0 4px}
.seg label{flex:1}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:9px 0;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--sub);font-weight:700;font-size:14px}
.seg input:checked+span{background:#2b3270;border-color:var(--accent);color:var(--text)}
.oddsrow{display:flex;gap:8px;margin-top:8px}
.oddsrow label{flex:1;display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:800}
.oddsrow input{flex:1;min-width:0;width:100%;background:none;border:none;color:var(--text);font-size:18px;font-weight:800;text-align:right;padding:2px}
.oddsedit{display:flex;gap:6px;align-items:flex-end;margin-top:6px}
.oddsedit .oddsrow{flex:1}
.oddsedit .btn{padding:10px 8px;font-size:12px;white-space:nowrap}
.prow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.pname{font-size:14px;font-weight:600;word-break:break-all}
.pname small{display:block;color:var(--sub);font-weight:400;font-size:11px}
.pctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.pctl input,.startrow input{width:96px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:15px;font-weight:700;border-radius:8px;padding:6px 8px;text-align:right}
.pctl input.custom{border-color:var(--gold);color:var(--gold)}
.pctl .btn,.startrow .btn{padding:7px 10px;font-size:12px}
.pctl .link{padding:0 2px}
.startrow{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.startrow span{flex:1;min-width:140px}
.me-edit{background:none;border:none;color:#c9cdf0;font-size:12px;padding:0;text-decoration:underline}
</style>
</head>
<body>
<div id="joinView" hidden>
  <div class="join">
    <h1>リアルタイムBET</h1>
    <p>ニックネームを入れて参加しましょう。<br>はじめに <b id="startPts">1,000</b>pt もらえます。</p>
    <form id="joinForm"><input id="joinName" maxlength="20" placeholder="ニックネーム" autocomplete="nickname">
    <button class="btn" type="submit">参加する</button></form>
  </div>
</div>

<div id="setupView" class="setup" hidden></div>

<div id="appView" hidden>
<header class="top">
  <div class="wallet">
    <div>
      <div class="lbl"><span id="meName">—</span> の所持pt <button class="me-edit" id="renameBtn">名前変更</button></div>
      <div class="pts"><span id="avail">—</span><small>pt</small></div>
    </div>
    <div class="right">
      BET中 <b id="staked">0</b> pt<br>
      順位 <b id="myRank">—</b>
    </div>
  </div>
  <div class="status" id="status"></div>
</header>

<main class="wrap">
  <section id="tab-rounds"></section>
  <section id="tab-rank" hidden></section>
  <section id="tab-admin" hidden></section>
</main>

<nav class="tabs"><div class="in">
  <button data-tab="rounds" class="on">お題</button>
  <button data-tab="rank">ランキング</button>
  <button data-tab="admin" id="adminTabBtn" hidden>運営</button>
</div></nav>
</div>

<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
